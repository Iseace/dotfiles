# Paleta oscura tomada de waybar (style.css / colors-waybar.css)
foreground   #f0f0f0
background   #0a0a0a
cursor       #d1d6d7
selection_foreground #ffffff
selection_background #333333

# Bordes y pestañas (mismos tonos que los módulos y workspaces de waybar)
active_border_color     #333333
inactive_border_color   #121212
bell_border_color       #ff4d4d
active_tab_foreground   #ffffff
active_tab_background   #333333
inactive_tab_foreground #f0f0f0
inactive_tab_background #121212

color0       #0a0a0a
color8       #8a8d8e
color1       #5f6f6e
color9       #6f8584
color2       #6c8483
color10      #7fa09d
color3       #7a8686
color11      #8a9796
color4       #7e8f8d
color12      #90a09d
color5       #859392
color13      #96a9a8
color6       #98a5a6
color14      #aab5b6
color7       #d1d6d7
color15      #ffffff

font_size 12
font_family JetBrainsMono
window_margin_width 15
remember_window_size no
background_opacity 0.5

#taps
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

